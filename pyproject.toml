[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoslice"
version = "0.1.0"
description = "EcoSlice - load-aware walls & infill for OrcaSlicer: FEM-driven localized reinforcement where a part's job demands it, material removal everywhere else."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "EcoSlice contributors" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
amg = ["pyamg>=5.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
